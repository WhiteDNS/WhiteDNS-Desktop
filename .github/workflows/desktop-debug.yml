name: CottenMax Beta Debug Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Debug package version"
        required: false
        default: "1.2.4-cottenmax-beta.20261021"
        type: string
      build_linux:
        description: "Also build Linux preview packages"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - WhiteDns

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DEBUG_VERSION: ${{ inputs.version || '1.2.4-cottenmax-beta.20261021' }}

concurrency:
  group: whitedns-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-debug:
    name: Windows x64 debug app
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6


      - name: Setup Python for source receipt verification
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify published CottenDNS source receipt
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          pin = json.loads(Path("vendor/cottendns.json").read_text())
          if not re.fullmatch(r"[0-9a-f]{40}", pin["commit"]):
              raise SystemExit("CottenDNS must reference a published full commit, not a local snapshot")
          receipt = json.loads(Path(pin["source_snapshot"]).read_text())
          source = Path(pin["directory"])
          tree = hashlib.sha256()
          for item in receipt["files"]:
              relative = item["path"]
              path = source / relative
              if not path.resolve().is_relative_to(source.resolve()):
                  raise SystemExit(f"Invalid source receipt path: {relative}")
              digest = hashlib.sha256(path.read_bytes().replace(b"\r\n", b"\n")).hexdigest()
              if digest != item["sha256_lf"]:
                  raise SystemExit(f"Stale CottenDNS source input: {relative}")
              tree.update(f"{relative} {digest}\n".encode())
          if tree.hexdigest() != receipt["source_tree_sha256_lf"]:
              raise SystemExit("CottenDNS source receipt tree hash does not match")
          print(f"Verified {len(receipt['files'])} production inputs for {pin['commit']}")
          PY

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: |
            desktop/go.sum
            MasterDnsVPN/go.sum
            CottenDNS/go.sum

      - name: Install GNU Make
        shell: powershell
        run: choco install make --no-progress --yes

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix desktop/frontend

      - name: Build frontend assets
        run: npm run build --prefix desktop/frontend

      - name: Install Wails CLI
        working-directory: desktop
        run: |
          WAILS_VERSION="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
          go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"

      - name: Test desktop integration
        working-directory: desktop
        run: go test ./...

      - name: Test CottenDNS engine
        working-directory: CottenDNS
        run: go test ./...

      - name: Prepare embedded DNS engines and Xray
        run: |
          make -C desktop SHELL=bash prepare-package
          make -C desktop SHELL=bash prepare-embedded-client TARGET_GOOS=windows TARGET_GOARCH=amd64
          make -C desktop SHELL=bash prepare-embedded-core TARGET_GOOS=windows TARGET_GOARCH=amd64

      - name: Build Windows debug app
        working-directory: desktop
        run: |
          wails build -clean -debug -platform windows/amd64
          make SHELL=bash package-assets

      - name: Verify runnable app
        run: |
          test -f "desktop/build/bin/WhiteDNS Desktop.exe"

      - name: Upload runnable app
        uses: actions/upload-artifact@v6
        with:
          name: WhiteDNS-Desktop-CottenMax-beta-debug-windows-x64
          path: desktop/build/bin/*
          if-no-files-found: error
          retention-days: 14

  linux-preview:
    if: github.event_name == 'push' || inputs.build_linux
    name: Linux ${{ matrix.label }} packages
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x64
            os: ubuntu-24.04
            arch: amd64
            formats: deb,rpm,arch,appimage
          - label: arm64
            os: ubuntu-24.04-arm
            arch: arm64
            formats: deb,rpm

    steps:
      - name: Checkout
        uses: actions/checkout@v6


      - name: Setup Python for source receipt verification
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify published CottenDNS source receipt
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          pin = json.loads(Path("vendor/cottendns.json").read_text())
          if not re.fullmatch(r"[0-9a-f]{40}", pin["commit"]):
              raise SystemExit("CottenDNS must reference a published full commit, not a local snapshot")
          receipt = json.loads(Path(pin["source_snapshot"]).read_text())
          source = Path(pin["directory"])
          tree = hashlib.sha256()
          for item in receipt["files"]:
              relative = item["path"]
              path = source / relative
              if not path.resolve().is_relative_to(source.resolve()):
                  raise SystemExit(f"Invalid source receipt path: {relative}")
              digest = hashlib.sha256(path.read_bytes().replace(b"\r\n", b"\n")).hexdigest()
              if digest != item["sha256_lf"]:
                  raise SystemExit(f"Stale CottenDNS source input: {relative}")
              tree.update(f"{relative} {digest}\n".encode())
          if tree.hexdigest() != receipt["source_tree_sha256_lf"]:
              raise SystemExit("CottenDNS source receipt tree hash does not match")
          print(f"Verified {len(receipt['files'])} production inputs for {pin['commit']}")
          PY

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: |
            desktop/go.sum
            MasterDnsVPN/go.sum
            CottenDNS/go.sum

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install current Linux build dependencies
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 install --no-install-recommends -y \
            build-essential curl file libarchive-tools pkg-config rpm zstd libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        run: npm ci --prefix desktop/frontend

      - name: Install Wails CLI
        working-directory: desktop
        run: |
          WAILS_VERSION="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
          go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"

      - name: Build Linux packages
        run: |
          make -C desktop package-linux-distros \
            VERSION="$DEBUG_VERSION" \
            LINUX_PLATFORMS="linux/${{ matrix.arch }}" \
            LINUX_CLIENT_ARCH="${{ matrix.arch }}" \
            LINUX_GO_TAGS="webkit2_41" \
            LINUX_WEBKIT="4.1" \
            LINUX_ASSET_SUFFIX="linux-${{ matrix.label }}" \
            LINUX_PACKAGE_OUTPUT_DIR="build/releases/debug" \
            LINUX_PACKAGE_FORMATS="${{ matrix.formats }}"

      - name: Validate Arch Linux package
        if: matrix.arch == 'amd64'
        run: |
          set -euo pipefail
          arch_package="$(find desktop/build/releases/debug -maxdepth 1 -type f -name '*.pkg.tar.zst' -print -quit)"
          test -n "$arch_package"
          archive_entries="$(bsdtar -tf "$arch_package")"
          grep -Fxq '.BUILDINFO' <<<"$archive_entries"
          grep -Fxq '.MTREE' <<<"$archive_entries"
          grep -Fxq '.PKGINFO' <<<"$archive_entries"
          pkginfo="$(bsdtar -xOf "$arch_package" .PKGINFO)"
          grep -Fxq 'xdata = pkgtype=pkg' <<<"$pkginfo"
          grep -Fxq 'arch = x86_64' <<<"$pkginfo"
          grep -Fxq 'depend = gtk3' <<<"$pkginfo"
          grep -Fxq 'depend = webkit2gtk-4.1' <<<"$pkginfo"
          package_dir="$(dirname "$arch_package")"
          package_name="$(basename "$arch_package")"
          docker run --rm -v "$PWD/$package_dir:/packages:ro" archlinux:base \
            pacman -Qip "/packages/$package_name"

      - name: Upload Arch Linux package
        if: matrix.arch == 'amd64'
        uses: actions/upload-artifact@v6
        with:
          name: WhiteDNS-Desktop-CottenMax-beta-debug-archlinux-x64
          path: desktop/build/releases/debug/whitedns-desktop-*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14

      - name: Upload runnable Linux app
        uses: actions/upload-artifact@v6
        with:
          name: WhiteDNS-Desktop-CottenMax-beta-debug-linux-${{ matrix.label }}
          path: desktop/build/bin/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux installers
        uses: actions/upload-artifact@v6
        with:
          name: WhiteDNS-Desktop-CottenMax-beta-debug-linux-${{ matrix.label }}-installers
          path: |
            desktop/build/releases/debug/WhiteDNS-Desktop-*
          if-no-files-found: error
          retention-days: 14
